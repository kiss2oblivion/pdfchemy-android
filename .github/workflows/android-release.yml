name: Android security and build

on:
  push:
    branches:
      - repo-android
      - main
      - feature/wave-2-audio-export
      - integration/2.1.0-2026-10-26
      - 'integration/**'
      - 'release/**'
      - 'gemini/**'
      - 'codex/**'
      - 'fix/**'
      - 'modernization/**'
  pull_request:
    branches:
      - repo-android
      - main
      - integration/2.1.0-2026-10-26
      - 'integration/**'
      - 'release/**'
      - 'gemini/**'
      - 'codex/**'
      - 'fix/**'
      - 'modernization/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0 (Node 24)
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1 (Node 24)
      - run: python3 -m unittest discover -s tools -p test_check_action_runtimes.py
      - run: python3 tools/check_action_runtimes.py
      - run: chmod +x gradlew
      - run: python3 -m unittest discover -s scripts -p test_run_android_instrumentation.py
      - run: python3 -m unittest discover -s scripts -p test_check_android_emulator_space.py
      - run: ./gradlew :app-host:securityAudit securityArchitecture :app-host:testDebugUnitTest --tests 'com.pdfchemy.app.arch.*' --tests 'com.pdfchemy.app.architecture.*' --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          fetch-depth: 0
      - run: python3 -m unittest discover -s tools -p test_check_secrets.py
      - run: python3 tools/check_secrets.py

  dependency-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0 (Node 24)
        with:
          java-version: '21'
          distribution: temurin
      - run: chmod +x gradlew
      - run: ./gradlew dependencyInventory
      - run: python3 tools/check_dependencies.py

  tests:
    needs: architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0 (Node 24)
        with:
          java-version: '21'
          distribution: temurin
      - run: chmod +x gradlew
      - run: ./gradlew :pdf-ipc:testDebugUnitTest :pdf-jail:testDebugUnitTest :app-host:testDebugUnitTest --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process

  android-instrumented-security:
    needs: architecture
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 24
            arch: x86
          - api: 30
            arch: x86_64
          - api: 34
            arch: x86_64
          - api: 36
            arch: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0 (Node 24)
        with:
          java-version: '21'
          distribution: temurin
      - run: chmod +x gradlew
      - name: Free unused hosted-runner SDK space
        run: |
          test "$GITHUB_ACTIONS" = true && test "$RUNNER_OS" = Linux
          df -h "$HOME"
          sudo rm -rf /usr/share/dotnet
          df -h "$HOME"
      - name: Build native test APKs before emulator startup
        run: ./gradlew :app-host:assembleDebug :app-host:assembleDebugAndroidTest --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process
      - name: Require emulator userdata headroom
        run: python3 scripts/check_android_emulator_space.py
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          target: google_apis
          ram-size: 2048M
          heap-size: 512M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: >-
            if [ '${{ matrix.api }}' = '24' ]; then
            python3 scripts/run_android_instrumentation.py --serial emulator-5554 --apk app-host/build/outputs/apk/debug/app-host-debug.apk --test-apk app-host/build/outputs/apk/androidTest/debug/app-host-debug-androidTest.apk --output build/reports/native-api24;
            else
            ./gradlew :app-host:connectedDebugAndroidTest --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.project.android.injected.adb.shell.command.timeout=900000 -Dcom.android.ddmlib.timeOut=900000;
            fi
      - name: Retain native test and installation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: native-security-api${{ matrix.api }}-${{ matrix.arch }}
          path: |
            build/reports/native-api24/
            app-host/build/outputs/androidTest-results/
            app-host/build/reports/androidTests/
          if-no-files-found: warn

  build:
    needs: [architecture, secrets, dependency-security, tests, android-instrumented-security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0 (Node 24)
        with:
          java-version: '21'
          distribution: temurin
      - run: chmod +x gradlew
      - run: ./gradlew :app-host:lintRelease :app-host:assembleDebug :app-host:assembleRelease --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process -PunsignedReleaseVerification=true
      - name: Verify compatibility corpus, smoke coverage, and release artifact hygiene
        run: |
          python3 -B -m unittest discover -s scripts -p test_release_gson_contract.py
          python3 scripts/check_release_gate.py --artifact
